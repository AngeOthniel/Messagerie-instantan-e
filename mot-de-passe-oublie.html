<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Messagerie instantanée</h1>
    <h2>Mot de passe oublié ?</h2>
    <p>Entrez votre adresse courriel pour recevoir
       un lien de récupération.</p>
    <form id="formRecuperation">
        <label for="email">Courriel :</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Votre adresse courriel"
            required
        >
        <button type="submit">
            Envoyer le lien
        </button>
    </form>
    <p id="messageRetour" role="status"></p>
    <p>
        <a href="index.html">Retour à la connexion</a>
    </p>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="recuperation.js"></script>
</body>
</html>
