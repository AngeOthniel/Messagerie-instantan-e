<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Messagerie instantanée</h1>
    <a href="contact.html">Contacts</a>
    <a href="parametre.html">Paramètres</a>
    <a href="index.html">Déconnexion</a>
    <h2>Conversation avec Amélie</h2>
    <p>En ligne</p>
    <div>
        <p><strong>Amélie :</strong> Salut ! Ça va ?</p>
        <p>10:20</p>
        <p><strong>Moi :</strong> Oui, ça va bien !</p>
        <p>10:21</p>
        <p>❤️ 1 👍 1 😂 1</p>
        <p><strong>Amélie :</strong> Super ! Regarde cette image :</p>
        <p>10:22</p>
        <p><strong>Moi :</strong> Wow ! C'est trop beau 😍</p>
        <p>10:23</p>
        <p>❤️ 1 👍 1 😂 1</p>
    </div>
    <h2>Envoyer un message</h2>
    <form>
        <label for="message">Message :</label>
        <input
            type="text"
            id="message"
            name="message"
            placeholder="Écrire un message..."
        >
        <button type="submit">Envoyer</button>
    </form>
</body>
</html>
