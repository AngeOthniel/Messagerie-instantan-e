   <h2>Conversation générale 🌍</h2>
    <p>Discutez avec tous les membres connectés</p>
    <!-- Les messages venant de Supabase apparaîtront ici -->
    <div class="messages"></div>
    <h2>Envoyer un message</h2>
    <form>
        <label for="message">Message :</label>
        <input
            type="text"
            id="message"
            name="message"
            placeholder="Écrire un message..."
        >
        <button type="submit">
            Envoyer
        </button>
    </form>
    <!-- Bibliothèque Supabase -->
