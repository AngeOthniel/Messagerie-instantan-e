<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Messagerie instantanée</h1>
    <a href="contact.html">Contacts</a>
    <a href="parametre.html">Paramètres</a>
    <a href="index.html">Déconnexion</a>
    <h2>Conversation avec Amélie</h2>
    <p>En ligne</p>
    <div class="messages">
        <p class="recu">
            <strong>Amélie :</strong> Salut ! Ça va ?
        </p>
        <p class="heure">10:20</p>
        <p class="envoye">
            <strong>Moi :</strong> Oui, ça va bien !
        </p>
        <p class="heure">10:21</p>
        <p class="reactions">
            ❤️ 1 👍 1 😂 1
        </p>
        <p class="recu">
            <strong>Amélie :</strong> Super ! Regarde cette image :
        </p>
        <p class="heure">10:22</p>
        <p class="envoye">
            <strong>Moi :</strong> Wow ! C'est trop beau 😍
        </p>
        <p class="heure">10:23</p>
        <p class="reactions">
            ❤️ 1 👍 1 😂 1
        </p>
    </div>
    <h2>Envoyer un message</h2>
    <form>
        <label for="message">Message :</label>
        <input
            type="text"
            id="message"
            name="message"
            placeholder="Écrire un message..."
        >
        <button type="submit">
            Envoyer
        </button>
    </form>
</body>
</html>
