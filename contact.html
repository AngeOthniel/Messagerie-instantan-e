<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Contacts - Messagerie</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="design.css">
</head>
<body>
    <h1>💬 Messagerie instantanée</h1>
    <nav aria-label="Navigation principale">
        <a href="contact.html" class="actif">
            👥 Contacts
        </a>
        <a href="conversation.html">
            🌍 Conversation générale
        </a>
        <a href="discussions.html">
            💬 Mes discussions
        </a>
        <a href="profil.html">
            👤 Mon profil
        </a>
    </nav>
    <main class="page-contacts">
        <div class="titre-page">
            <h2>Mes contacts 👥</h2>
            <p>
                Retrouvez les utilisateurs et
                démarrez une discussion privée.
            </p>
        </div>
        <input
            type="search"
            id="rechercheContact"
            placeholder="🔍 Rechercher un contact..."
            aria-label="Rechercher un contact"
        >
        <div id="listeContacts"></div>
        <p id="messageRetour" role="status"></p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="contacts.js"></script>
</body>
</html>
