<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Nouveau mot de passe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Messagerie instantanée</h1>
    <h2>Créer un nouveau mot de passe</h2>
    <form id="formNouveauMotDePasse">
        <label for="password">Nouveau mot de passe :</label>
        <input type="password" id="password"
               minlength="6" required>
        <label for="confirmation">Confirmer le mot de passe :</label>
        <input type="password" id="confirmation"
               minlength="6" required>
        <button type="submit">Enregistrer</button>
    </form>
    <p id="messageRetour" role="status"></p>
    <p>
        <a href="index.html">Retour à la connexion</a>
    </p>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="nouveau-mot-de-passe.js"></script>
</body>
</html>
